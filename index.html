<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="gritos — chat P2P sin servidor, sin cuentas, efímero." />
    <title>gritos</title>
    <script>
      // Anti-flash (spec §10.6): apply the persisted theme before the bundle
      // loads. Reads the raw Settings JSON stored under 'gritos:settings'.
      ;(function () {
        try {
          var raw = localStorage.getItem('gritos:settings')
          var theme = (raw && JSON.parse(raw).theme) || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          /* fall back to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

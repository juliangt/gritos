name: Audit

# Weekly dependency audit against the lockfile. Scheduled workflows only run
# on the default branch; workflow_dispatch allows a manual run anywhere.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: npm audit, high and above
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
